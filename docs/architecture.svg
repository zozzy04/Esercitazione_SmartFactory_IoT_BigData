<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#94A3B8"/>
    </marker>
    <marker id="ab" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#3B82F6"/>
    </marker>
    <marker id="aG" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="490" rx="14" fill="#F1F5F9"/>

  <!-- Title -->
  <text x="460" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A" letter-spacing="0.4">Smart Factory — IoT Telemetry Pipeline</text>

  <!-- ── SENSORI ── -->
  <rect x="28" y="142" rx="8" width="108" height="80" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="82" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Sensori</text>
  <text x="82" y="188" text-anchor="middle" font-size="10" fill="#64748B">simulati</text>
  <text x="82" y="204" text-anchor="middle" font-size="9" fill="#94A3B8">Faker · random</text>

  <!-- → Sensori → Producer -->
  <line x1="136" y1="182" x2="170" y2="182" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- ── PRODUCER A ── -->
  <rect x="172" y="114" rx="8" width="150" height="136" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <rect x="172" y="114" rx="8" width="150" height="32" fill="#3B82F6"/>
  <rect x="172" y="134" width="150" height="12" fill="#3B82F6"/>
  <text x="247" y="135" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">Producer — Parte A</text>
  <text x="247" y="162" text-anchor="middle" font-size="9.5" fill="#1D4ED8">genera record sintetici</text>
  <text x="247" y="177" text-anchor="middle" font-size="9.5" fill="#1D4ED8">pubblica su Kafka</text>
  <text x="247" y="192" text-anchor="middle" font-size="9.5" fill="#1D4ED8">partition key = device_id</text>
  <text x="247" y="210" text-anchor="middle" font-size="8.5" fill="#60A5FA">bulk insert → raw_telemetry</text>
  <text x="247" y="224" text-anchor="middle" font-size="8" fill="#93C5FD">kafka-python · pymongo · Faker</text>

  <!-- → Producer → Kafka -->
  <line x1="322" y1="182" x2="358" y2="182" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- ── KAFKA ── -->
  <rect x="360" y="84" rx="8" width="200" height="212" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <rect x="360" y="84" rx="8" width="200" height="32" fill="#F59E0B"/>
  <rect x="360" y="104" width="200" height="12" fill="#F59E0B"/>
  <text x="460" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Apache Kafka — Broker</text>
  <rect x="378" y="128" rx="5" width="164" height="22" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="460" y="143" text-anchor="middle" font-size="10" fill="#92400E">iot.ambientale</text>
  <rect x="378" y="156" rx="5" width="164" height="22" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="460" y="171" text-anchor="middle" font-size="10" fill="#92400E">iot.macchinari</text>
  <rect x="378" y="184" rx="5" width="164" height="22" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="460" y="199" text-anchor="middle" font-size="10" fill="#92400E">iot.logistica</text>
  <rect x="378" y="212" rx="5" width="164" height="22" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="460" y="227" text-anchor="middle" font-size="10" fill="#92400E">iot.qualita</text>
  <text x="460" y="274" text-anchor="middle" font-size="8.5" fill="#B45309">consumer group: smart-factory-consumers</text>

  <!-- → Kafka → Consumer -->
  <line x1="560" y1="182" x2="595" y2="182" stroke="#10B981" stroke-width="1.5" marker-end="url(#aG)"/>

  <!-- ── CONSUMER B ── -->
  <rect x="597" y="114" rx="8" width="150" height="136" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <rect x="597" y="114" rx="8" width="150" height="32" fill="#10B981"/>
  <rect x="597" y="134" width="150" height="12" fill="#10B981"/>
  <text x="672" y="135" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">Consumer — Parte B</text>
  <text x="672" y="162" text-anchor="middle" font-size="9.5" fill="#065F46">valida messaggi</text>
  <text x="672" y="177" text-anchor="middle" font-size="9.5" fill="#065F46">arricchisce + genera allarmi</text>
  <text x="672" y="192" text-anchor="middle" font-size="9.5" fill="#065F46">aggrega a finestra (1 min)</text>
  <text x="672" y="210" text-anchor="middle" font-size="8.5" fill="#34D399">gestisce offset Kafka</text>
  <text x="672" y="224" text-anchor="middle" font-size="8" fill="#6EE7B7">kafka-python · pymongo</text>

  <!-- ↓ Producer → MongoDB Staging -->
  <line x1="247" y1="250" x2="247" y2="308" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ab)"/>
  <text x="262" y="284" font-size="8.5" fill="#3B82F6">staging</text>

  <!-- ↓ Consumer → MongoDB Serving -->
  <line x1="672" y1="250" x2="672" y2="308" stroke="#10B981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#aG)"/>
  <text x="687" y="284" font-size="8.5" fill="#10B981">serving</text>

  <!-- ── MONGODB STAGING ── -->
  <rect x="148" y="310" rx="8" width="198" height="132" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <rect x="148" y="310" rx="8" width="198" height="30" fill="#059669"/>
  <rect x="148" y="328" width="198" height="12" fill="#059669"/>
  <text x="247" y="330" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">MongoDB — Staging</text>
  <text x="247" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">raw_telemetry</text>
  <text x="247" y="375" text-anchor="middle" font-size="9" fill="#047857">messaggi grezzi, così come generati</text>
  <text x="247" y="390" text-anchor="middle" font-size="9" fill="#047857">append-only · bulk insert</text>
  <text x="247" y="414" text-anchor="middle" font-size="8" fill="#34D399">idx: device_id + timestamp</text>
  <text x="247" y="428" text-anchor="middle" font-size="8" fill="#94A3B8">owner: Studente A</text>

  <!-- ── MONGODB SERVING ── -->
  <rect x="542" y="310" rx="8" width="218" height="132" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <rect x="542" y="310" rx="8" width="218" height="30" fill="#059669"/>
  <rect x="542" y="328" width="218" height="12" fill="#059669"/>
  <text x="651" y="330" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">MongoDB — Serving</text>
  <text x="651" y="354" text-anchor="middle" font-size="9" fill="#065F46">processed_events — validati e arricchiti</text>
  <text x="651" y="370" text-anchor="middle" font-size="9" fill="#065F46">alerts — misure oltre soglia</text>
  <text x="651" y="386" text-anchor="middle" font-size="9" fill="#065F46">aggregations — media al minuto</text>
  <text x="651" y="414" text-anchor="middle" font-size="8" fill="#34D399">idx: device_id + timestamp</text>
  <text x="651" y="428" text-anchor="middle" font-size="8" fill="#94A3B8">owner: Studente B</text>

  <!-- ── LEGEND ── -->
  <rect x="28" y="460" rx="3" width="10" height="10" fill="#3B82F6"/>
  <text x="43" y="469" font-size="9" fill="#475569">Parte A (Producer)</text>
  <rect x="150" y="460" rx="3" width="10" height="10" fill="#10B981"/>
  <text x="165" y="469" font-size="9" fill="#475569">Parte B (Consumer)</text>
  <rect x="282" y="460" rx="3" width="10" height="10" fill="#F59E0B"/>
  <text x="297" y="469" font-size="9" fill="#475569">Apache Kafka</text>
  <rect x="384" y="460" rx="3" width="10" height="10" fill="#059669"/>
  <text x="399" y="469" font-size="9" fill="#475569">MongoDB</text>
  <line x1="468" y1="465" x2="496" y2="465" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="502" y="469" font-size="9" fill="#475569">scrittura su DB</text>
</svg>
